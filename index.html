<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Mensagens de fé, esperança e proteção para o seu dia.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Mensagem de Fé</title>
</head>
<body>
  <main class="app">
    <header><div class="cross">✝</div><h1>Mensagem de Fé</h1><button id="themeBtn" class="icon-btn">🌙</button></header>
    <section class="card"><div class="quote">“</div><p id="message">Que a sua fé seja maior que os seus medos. Deus está cuidando de você.</p><span id="category">Fé</span></section>
    <div class="actions"><button id="newBtn" class="primary">✨ Nova mensagem</button><div class="secondary-row"><button id="favBtn">♡ Favoritar</button><button id="shareBtn">📤 Compartilhar</button><button id="speakBtn">🔊 Ouvir</button></div></div>
    <p id="status" class="status"></p>
    <footer><p>Que Deus abençoe o seu dia. 🙏</p><button id="installBtn" class="install hidden">📱 Instalar aplicativo</button></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
